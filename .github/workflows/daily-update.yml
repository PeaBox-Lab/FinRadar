name: Daily KPI Update

# Runs the FinRadar data pipeline daily: fetches public data, computes KPIs
# and benchmarks, regenerates the static site under `site/`, commits to main,
# and deploys `site/` to the `gh-pages` branch for GitHub Pages.

on:
  schedule:
    - cron: "30 2 * * *" # Daily at 02:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run the KPI pipeline
        run: python3 scripts/pipeline/fetch_kpis.py
        env:
          DATA_GOV_IN_TOKEN: ${{ secrets.DATA_GOV_IN_TOKEN }}

      - name: Regenerate static site
        run: python3 scripts/pipeline/page_generator.py

      - name: Commit and push data + site to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_kpis.json site/
          git commit -m "chore: daily KPI update $(date -u +%F)" || echo "No changes; skipping commit"
          git push origin HEAD:main
          echo "Done."

      # Deploy the built `site/` folder to the `gh-pages` branch.
      # This keeps GitHub Pages serving the site from gh-pages (no /site prefix)
      # while the repo's main branch holds the source + build output.
      - name: Deploy site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: true
          commit_message: "deploy: update gh-pages from main (site/)"
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"