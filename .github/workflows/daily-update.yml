name: Daily KPI Update

# Runs the FinRadar data pipeline daily: fetches public data, computes KPIs
# and benchmarks, and commits the updated data/latest_kpis.json to main.
# GitHub Pages then publishes the refreshed site on the next push.

on:
  schedule:
    - cron: "30 2 * * *" # Daily at 02:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run the KPI pipeline
        run: python3 scripts/pipeline/fetch_kpis.py
        env:
          DATA_GOV_IN_TOKEN: ${{ secrets.DATA_GOV_IN_TOKEN }}

      - name: Regenerate static site
        run: python3 scripts/pipeline/page_generator.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_kpis.json site/
          git commit -m "chore: daily KPI update $(date -u +%F)" || echo "No changes; skipping commit"
          git push origin HEAD:main
          echo "Done."
